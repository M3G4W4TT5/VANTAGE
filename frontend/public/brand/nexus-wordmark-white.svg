  <title id="title">Nexus wordmark</title>
  <desc id="description">Transparent Nexus wordmark. The n and e reuse Vantage outlines; the u is the same n rotated 180 degrees; the s reuses Atlas. The X uses two unscaled Vantage V outlines, with the lower copy rotated 180 degrees and their tip edges joined. The arms are shortened by clipping to keep the letter height while preserving the original Vantage and Atlas stroke thickness and angles.</desc>
