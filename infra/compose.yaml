name: vantage
services:
  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    environment:
      POSTGRES_DB: vantage
      POSTGRES_USER: vantage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/init-local.mjs first}
    ports:
      - "127.0.0.1:${VANTAGE_DB_PORT:-54329}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantage -d vantage"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    profiles: [container, test]
    build: { context: .., dockerfile: infra/Dockerfile }
    image: vantage-local:0.1.0
    command: ["--migrate"]
    environment:
      ConnectionStrings__Vantage: "Host=db;Database=vantage;Username=vantage;Password=${POSTGRES_PASSWORD}"
    depends_on:
      db: { condition: service_healthy }
  app:
    profiles: [container, test]
    image: vantage-local:0.1.0
    build: { context: .., dockerfile: infra/Dockerfile }
    ports:
      - "127.0.0.1:${VANTAGE_HTTP_PORT:-5080}:8080"
    environment:
      URLS: http://0.0.0.0:8080
      ConnectionStrings__Vantage: "Host=db;Database=vantage;Username=vantage;Password=${POSTGRES_PASSWORD}"
    networks:
      default:
        aliases: [vantage.test]
    depends_on:
      migrate: { condition: service_completed_successfully }
  browser:
    profiles: [test]
    build: { context: .., dockerfile: infra/playwright.Dockerfile }
    init: true
    ipc: host
    environment:
      PLAYWRIGHT_BASE_URL: http://vantage.test:8080
    depends_on:
      app: { condition: service_started }
volumes:
  database:
